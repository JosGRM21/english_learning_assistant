name: Release App (Dual AVX / AVX2)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    permissions:
      contents: write
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        flavor:
          - name: 'legacy'
            config_file: 'src-tauri/tauri.legacy.conf.json'
            features: ''
            manifest_name: 'latest-legacy.json'
            display_name: 'Legacy (AVX)'
          - name: 'avx2'
            config_file: 'src-tauri/tauri.avx2.conf.json'
            features: '--features native-kokoro'
            manifest_name: 'latest-avx2.json'
            display_name: 'Optimized (AVX2)'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri App (${{ matrix.flavor.display_name }})
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'ELA v__VERSION__'
          releaseBody: 'English Learning Assistant (ELA) - Descarga la versión que mejor se adapte a tu procesador (AVX estándar o AVX2 con aceleración nativa).'
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: false
          args: --config ${{ matrix.flavor.config_file }} ${{ matrix.flavor.features }}

      - name: Generate and Upload Updater Manifest (${{ matrix.flavor.manifest_name }})
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $repo = "${{ github.repository }}"
          $tag = "${{ github.ref_name }}"
          $headers = @{
            "Authorization" = "Bearer $env:GITHUB_TOKEN"
            "Accept"        = "application/vnd.github+json"
            "User-Agent"    = "GitHub-Actions-Tauri-Updater"
          }

          # 1. Obtener la Release actual y sus assets
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/releases/tags/$tag" -Headers $headers
          $flavorPattern = if ("${{ matrix.flavor.name }}" -eq "legacy") { "*Legacy*setup.exe" } else { "*AVX2*setup.exe" }

          $exeAsset = $release.assets | Where-Object { $_.name -like $flavorPattern -and -not ($_.name -like "*.sig") } | Select-Object -First 1
          $sigAsset = $release.assets | Where-Object { $_.name -eq "$($exeAsset.name).sig" } | Select-Object -First 1

          if (-not $exeAsset -or -not $sigAsset) {
            Write-Error "No se encontraron los assets .exe o .sig para ${{ matrix.flavor.name }}"
            exit 1
          }

          # 2. Descargar el contenido de la firma .sig
          $sigResponse = Invoke-WebRequest -Uri $sigAsset.browser_download_url -Headers $headers -UseBasicParsing
          $signatureText = [System.Text.Encoding]::UTF8.GetString($sigResponse.Content).Trim()

          # 3. Construir el objeto JSON de actualización de Tauri v2
          $manifest = @{
            version   = "$($tag.TrimStart('v'))"
            notes     = "Actualización automática de ELA ${{ matrix.flavor.display_name }} ($tag)"
            pub_date  = (Get-Date -Format "yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{
              "windows-x86_64" = @{
                signature = $signatureText
                url       = $exeAsset.browser_download_url
              }
            }
          }

          $jsonContent = $manifest | ConvertTo-Json -Depth 5
          $jsonFileName = "${{ matrix.flavor.manifest_name }}"
          [System.IO.File]::WriteAllText("$PWD/$jsonFileName", $jsonContent)

          # 4. Eliminar si ya existía previamente el asset con ese nombre
          $existingAsset = $release.assets | Where-Object { $_.name -eq $jsonFileName }
          if ($existingAsset) {
            Write-Host "Borrando versión anterior del asset $jsonFileName..."
            Invoke-RestMethod -Method Delete -Uri "https://api.github.com/repos/$repo/releases/assets/$($existingAsset.id)" -Headers $headers
          }

          # 5. Subir el archivo manifest al Release
          $uploadUrl = $release.upload_url -replace '\{\?name,label\}', "?name=$jsonFileName"
          $uploadHeaders = @{
            "Authorization" = "Bearer $env:GITHUB_TOKEN"
            "Content-Type"  = "application/json"
            "User-Agent"    = "GitHub-Actions-Tauri-Updater"
          }
          $bytes = [System.Text.Encoding]::UTF8.GetBytes($jsonContent)
          Invoke-RestMethod -Method Post -Uri $uploadUrl -Headers $uploadHeaders -Body $bytes
          Write-Host "¡$jsonFileName subido exitosamente a la release $tag!"
