name: Release App (Unified Multi-SIMD)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install npm dependencies
        run: npm ci

      - name: Fetch Universal ONNX Runtime DLL
        shell: pwsh
        run: |
          $url = "https://github.com/microsoft/onnxruntime/releases/download/v1.28.0/onnxruntime-win-x64-1.28.0.zip"
          Write-Host "Downloading universal ONNX Runtime DLL from $url..."
          Invoke-WebRequest -Uri $url -OutFile "ort.zip"
          Expand-Archive -Path "ort.zip" -DestinationPath "ort_extracted"
          Copy-Item "ort_extracted\onnxruntime-win-x64-1.28.0\lib\onnxruntime.dll" "src-tauri\onnxruntime.dll"
          Remove-Item -Recurse -Force "ort.zip", "ort_extracted"

      - name: Build Tauri App
        id: tauri_build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'ELA v__VERSION__'
          releaseBody: 'English Learning Assistant (ELA) - Binario unificado de alto rendimiento con detección automática de microarquitectura CPU (AVX-512, AVX2, AVX, SSE).'
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: false

      - name: Generate and Upload Updater Manifest (latest.json)
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.tauri_build.outputs.releaseId }}
          APP_VERSION: ${{ steps.tauri_build.outputs.appVersion }}
        run: |
          $repo = "${{ github.repository }}"
          $headers = @{
            "Authorization" = "Bearer $env:GITHUB_TOKEN"
            "Accept"        = "application/vnd.github+json"
            "User-Agent"    = "GitHub-Actions-Tauri-Updater"
          }

          # 1. Obtener la Release actual por ID seguro
          $releaseId = "$env:RELEASE_ID"
          Write-Host "Obteniendo release con ID: $releaseId"
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/releases/$releaseId" -Headers $headers

          # 2. Localizar el ejecutable instalador y su firma
          $exeAsset = $release.assets | Where-Object { $_.name -like "*setup.exe" -and -not ($_.name -like "*.sig") } | Select-Object -First 1
          if (-not $exeAsset) {
            $exeAsset = $release.assets | Where-Object { $_.name -like "*.exe" -and -not ($_.name -like "*.sig") } | Select-Object -First 1
          }
          $sigAsset = $release.assets | Where-Object { $_.name -eq "$($exeAsset.name).sig" } | Select-Object -First 1

          if (-not $exeAsset -or -not $sigAsset) {
            Write-Error "No se encontraron los assets instalador .exe o su firma .sig"
            exit 1
          }

          # 3. Descargar el contenido de la firma .sig
          $sigResponse = Invoke-WebRequest -Uri $sigAsset.browser_download_url -Headers $headers -UseBasicParsing
          $signatureText = [System.Text.Encoding]::UTF8.GetString($sigResponse.Content).Trim()

          # 4. Construir el objeto JSON canónico de actualización de Tauri v2 (latest.json)
          $versionNumber = if ($env:APP_VERSION) { $env:APP_VERSION } else { "$($release.tag_name)".TrimStart('v') }
          $manifest = @{
            version   = "$versionNumber"
            notes     = "Actualización automática de English Learning Assistant (v$versionNumber)"
            pub_date  = (Get-Date -Format "yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{
              "windows-x86_64" = @{
                signature = $signatureText
                url       = $exeAsset.browser_download_url
              }
            }
          }

          $jsonContent = $manifest | ConvertTo-Json -Depth 5
          $jsonFileName = "latest.json"
          [System.IO.File]::WriteAllText("$PWD/$jsonFileName", $jsonContent)

          # 5. Eliminar si ya existía previamente el asset latest.json
          $existingAsset = $release.assets | Where-Object { $_.name -eq $jsonFileName }
          if ($existingAsset) {
            Write-Host "Borrando versión anterior del asset $jsonFileName..."
            Invoke-RestMethod -Method Delete -Uri "https://api.github.com/repos/$repo/releases/assets/$($existingAsset.id)" -Headers $headers
          }

          # 6. Subir el manifest latest.json al Release
          $uploadUrl = $release.upload_url -replace '\{\?name,label\}', "?name=$jsonFileName"
          $uploadHeaders = @{
            "Authorization" = "Bearer $env:GITHUB_TOKEN"
            "Content-Type"  = "application/json"
            "User-Agent"    = "GitHub-Actions-Tauri-Updater"
          }
          $bytes = [System.Text.Encoding]::UTF8.GetBytes($jsonContent)
          Invoke-RestMethod -Method Post -Uri $uploadUrl -Headers $uploadHeaders -Body $bytes
          Write-Host "¡$jsonFileName unificado subido exitosamente a la release $($release.tag_name)!"
